name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'O que gerar'
        type: choice
        default: 'ambos'
        options:
          - ambos
          - portable
          - instalador
      require_signature:
        description: 'Falhar se os .exe não saírem com assinatura válida'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # Informativo aqui (não bloqueia a geração do instalador); o workflow Release e o CI é que barram por teste.
      - run: npm test
        continue-on-error: true

      - run: npm run build

      # Assinatura de código: scripts/ci-build.mjs escolhe o modo pelos segredos do repositório
      # (certificado .pfx em WIN_CSC_LINK, ou Azure Trusted Signing em AZURE_*). Sem nenhum segredo o
      # build sai sem assinatura — funciona, mas o Windows SmartScreen mostra "editor desconhecido".
      - name: Build
        run: node scripts/ci-build.mjs --win ${{ inputs.build_target == 'portable' && 'portable' || inputs.build_target == 'instalador' && 'nsis' || '' }} --publish=never
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TS_ENDPOINT: ${{ secrets.AZURE_TS_ENDPOINT }}
          AZURE_TS_ACCOUNT: ${{ secrets.AZURE_TS_ACCOUNT }}
          AZURE_TS_PROFILE: ${{ secrets.AZURE_TS_PROFILE }}
          AZURE_TS_PUBLISHER: ${{ secrets.AZURE_TS_PUBLISHER }}

      - name: Verificar assinatura dos .exe
        shell: pwsh
        run: |
          $invalid = 0
          Get-ChildItem release -Filter *.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            Write-Host ("{0}: {1} {2}" -f $_.Name, $sig.Status, $sig.SignerCertificate.Subject)
            if ($sig.Status -ne 'Valid') { $invalid++ }
          }
          if ($invalid -gt 0) {
            if ('${{ inputs.require_signature }}' -eq 'true') { Write-Error "$invalid binário(s) sem assinatura válida."; exit 1 }
            Write-Host "::warning::$invalid binário(s) sem assinatura válida — o SmartScreen vai mostrar aviso de editor desconhecido."
          }

      # Dois artefatos separados (em vez de um .zip com os dois .exe juntos), pra quem só precisa de um
      # baixar só o que precisa. if-no-files-found: ignore porque build_target=portable|instalador só
      # gera um dos dois.
      - name: Upload instalador completo
        uses: actions/upload-artifact@v4
        with:
          name: Deskbox-Setup
          path: release/*-setup.exe
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload versão portátil
        uses: actions/upload-artifact@v4
        with:
          name: Deskbox-Portable
          path: release/*-portable.exe
          if-no-files-found: ignore
          retention-days: 14
