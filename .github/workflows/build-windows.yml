name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'O que gerar'
        type: choice
        default: 'ambos'
        options:
          - ambos
          - portable
          - instalador

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build

      - name: Build (ambos)
        if: ${{ inputs.build_target == 'ambos' }}
        run: npx electron-builder --win --publish=never

      - name: Build (só portable)
        if: ${{ inputs.build_target == 'portable' }}
        run: npx electron-builder --win portable --publish=never

      - name: Build (só instalador)
        if: ${{ inputs.build_target == 'instalador' }}
        run: npx electron-builder --win nsis --publish=never

      # Sem certificado de assinatura de código: o instalador funciona
      # normalmente, mas o Windows SmartScreen mostra um aviso de "editor
      # não reconhecido" na primeira execução (Mais informações > Executar
      # assim mesmo). Normal para builds de teste sem assinatura.
      #
      # Dois artefatos separados (em vez de um .zip com os dois .exe juntos),
      # pra quem só precisa de um dos dois baixar só o que precisa.
      # if-no-files-found: ignore porque um build com build_target=portable
      # ou =instalador só gera um dos dois arquivos.
      - name: Upload instalador completo
        uses: actions/upload-artifact@v4
        with:
          name: Deskbox-Setup
          path: release/*-setup.exe
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload versão portátil
        uses: actions/upload-artifact@v4
        with:
          name: Deskbox-Portable
          path: release/*-portable.exe
          if-no-files-found: ignore
          retention-days: 14
