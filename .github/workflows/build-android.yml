name: Build Android APK (Deskbox Celular)

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # APK de debug: assinado automaticamente com a chave de debug do Android, serve para instalar
      # manualmente ("fontes desconhecidas"). O workflow Release gera o APK assinado com a chave própria.
      - run: cp app/build/outputs/apk/debug/app-debug.apk ../Deskbox-Phone.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Deskbox-Phone-APK
          path: Deskbox-Phone.apk
          if-no-files-found: error
          retention-days: 14
