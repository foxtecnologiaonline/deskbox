name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'android/**'
      - 'docs/**'
      - '**/*.md'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run typecheck

      - name: Testes (sync, criptografia, servidor do celular)
        run: npm test

      - run: npm run build

      # Ponta a ponta com o Electron de verdade: CSS/JS e proxy por serviço, viewer WebRTC com celular simulado.
      - name: E2E (Electron + CDP, sob Xvfb)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          xvfb-run -a node scripts/e2e.mjs
