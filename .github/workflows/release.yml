name: Release

# Publica uma versão: crie uma tag vX.Y.Z igual à "version" do package.json e dê push.
#   git tag v0.2.0 && git push origin v0.2.0
# O electron-builder envia instaladores + latest*.yml pro GitHub Releases — é de lá que o auto-update
# do Deskbox lê. A release nasce como RASCUNHO (job prepare) e só é publicada no fim (job publish), depois
# que Windows, Linux, macOS e o APK subiram: ninguém vê (nem o auto-update baixa) uma versão pela metade, e
# os 3 builds paralelos não disputam a criação da mesma release.
# Rodando manualmente (workflow_dispatch) faz um ensaio: compila tudo e sobe como artefatos, sem publicar nada.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      require_signature:
        description: 'Falhar se os binários não saírem assinados'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Barra a publicação: testes e conferência tag × versão rodam ANTES de qualquer build. Sem isso os jobs
  # de Windows/macOS (que não dependem do Linux) publicariam um release com testes quebrados no feed do auto-update.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Conferir tag × versão do package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$pkg" ]; then
            echo "::error::A tag ${GITHUB_REF_NAME} não bate com a versão do package.json ($pkg)."
            exit 1
          fi

      - run: npm ci

      - name: Testes
        run: npm test

  prepare:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Criar release (rascunho)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME já existe — os builds anexam a ela."
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Deskbox $GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: [verify, prepare]
    # prepare só roda em tag; no ensaio (workflow_dispatch) ele é "skipped" e o build segue mesmo assim.
    if: ${{ !cancelled() && needs.verify.result == 'success' && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
          - os: macos-latest
            args: --mac --x64 --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build

      - name: Build${{ startsWith(github.ref, 'refs/tags/v') && ' e publicar' || ' (ensaio, sem publicar)' }}
        run: node scripts/ci-build.mjs ${{ matrix.args }} --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TS_ENDPOINT: ${{ secrets.AZURE_TS_ENDPOINT }}
          AZURE_TS_ACCOUNT: ${{ secrets.AZURE_TS_ACCOUNT }}
          AZURE_TS_PROFILE: ${{ secrets.AZURE_TS_PROFILE }}
          AZURE_TS_PUBLISHER: ${{ secrets.AZURE_TS_PUBLISHER }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verificar assinatura dos .exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $invalid = 0
          Get-ChildItem release -Filter *.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            Write-Host ("{0}: {1} {2}" -f $_.Name, $sig.Status, $sig.SignerCertificate.Subject)
            if ($sig.Status -ne 'Valid') { $invalid++ }
          }
          if ($invalid -gt 0) {
            if ('${{ inputs.require_signature }}' -eq 'true') { Write-Error "$invalid binário(s) sem assinatura válida."; exit 1 }
            Write-Host "::warning::$invalid binário(s) sem assinatura válida."
          }

      - name: Subir artefatos do ensaio
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/latest*.yml
          if-no-files-found: warn
          retention-days: 7

  # App Android do controle de celular. Vai como asset fixo "Deskbox-Phone.apk" em cada release, então
  # /releases/latest/download/Deskbox-Phone.apk (o QR de download do Deskbox) sempre aponta pra mais nova.
  android:
    needs: build
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      DESKBOX_VERSION_CODE: ${{ github.run_number }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        shell: bash
        run: |
          chmod +x gradlew
          export DESKBOX_VERSION="$(node -p "require('../package.json').version")"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/deskbox.jks"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/deskbox.jks"
            ./gradlew assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk ../Deskbox-Phone.apk
          else
            echo "::warning::Sem ANDROID_KEYSTORE_BASE64: APK de debug — atualizar o app no celular vai exigir desinstalar a versão anterior."
            ./gradlew assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk ../Deskbox-Phone.apk
          fi
          ls -l ../Deskbox-Phone.apk

      - name: Anexar ao release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" Deskbox-Phone.apk --clobber

      - name: Subir artefato do ensaio
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: Deskbox-Phone-APK
          path: Deskbox-Phone.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[] | "\(.name)\t\(.size)"'
